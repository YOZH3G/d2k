name: CI

# Pipeline order follows the usual industry rule: cheap checks first, and every
# expensive stage waits for them (fail fast).
#
#   1. lint, warnings          — seconds; block everything below
#   2. build (9 CPUs), unit    — the product compiles everywhere and its tests pass
#   3. sanitizers, integration — slower; run only when stage 2 is green
#   4. ci-ok                   — the single required status check
#
# Heavy release packaging (static OpenSSL for d2ktg on nine CPUs) is NOT here.
# It belongs to release.yml. CI proves the code; the release builds the package.

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  pull_request:
    paths-ignore: ['**/*.md', 'docs/**', 'LICENSE']
  workflow_dispatch:

# Least privilege: read the code, nothing else.
permissions:
  contents: read

# A newer push to the same ref makes the older run useless. Cancel it on pull
# requests; on main every commit keeps its own verdict.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  ZIG_VERSION: '0.16.0'
  ZIG_SHA256: '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00'
  ZIG_MIPS64EL_VERSION: '0.14.1'
  ZIG_MIPS64EL_SHA256: '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c'

jobs:
  # ── Stage 1: static checks ────────────────────────────────────────────────

  lint:
    name: Lint — shell scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: shellcheck
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find scripts files spike -type f -name '*.sh' -print0)
          files+=(files/d2k-instagram-dns.sh files/d2k-update.sh files/d2k-openwrt-init files/d2k-tg-firewall.sh)
          shellcheck -s sh "${files[@]}"

  warnings:
    name: Warnings — second compiler (gcc -Werror)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - name: datapath
        run: make -C datapath gcc-warn GCC=gcc
      - name: core
        run: make -C core gcc-warn GCC=gcc
      - name: telegram
        run: make -C telegram gcc-warn

  # ── Stage 2: build and unit tests ─────────────────────────────────────────

  build:
    name: Build — ${{ matrix.arch }}
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: true
      matrix:
        arch: [arm64, arm, mipsel, mips, mips64el, amd64, x86, ppc64, riscv64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
          mips64el-version: ${{ env.ZIG_MIPS64EL_VERSION }}
          mips64el-sha256: ${{ env.ZIG_MIPS64EL_SHA256 }}
      - name: Build d2kd, d2kc and d2kpanel
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          . scripts/build-target.sh
          mkdir -p out
          for component in datapath core panel; do
            make -C "$component" release ARCH="$ARCH" TARGET="$TARGET" \
              TARGET_FLAGS="$TARGET_FLAGS" ZIG="$BUILD_ZIG" BUILDDIR="$PWD/out" \
              COMMIT="$GITHUB_SHA" BUILT="$(date -u +%Y-%m-%dT%H:%M:%SZ)" DIRTY=0 \
              RELEASE_ID=ci VERSION=ci
          done
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: d2k-${{ matrix.arch }}
          path: out/
          retention-days: 7
          if-no-files-found: error

  unit:
    name: Unit — ${{ matrix.component }}
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { component: datapath,     target: check }
          - { component: core,         target: check }
          - { component: detect,       target: check }
          - { component: panel,        target: test }
          - { component: telegram,     target: test }
          - { component: relay-enroll, target: test }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install OpenSSL headers
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libssl-dev pkg-config
      - uses: ./.github/actions/setup-zig
        with:
          version: ${{ env.ZIG_VERSION }}
          sha256: ${{ env.ZIG_SHA256 }}
          mips64el-version: ${{ env.ZIG_MIPS64EL_VERSION }}
          mips64el-sha256: ${{ env.ZIG_MIPS64EL_SHA256 }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: make -C ${{ matrix.component }} ${{ matrix.target }}
        run: make -C "${{ matrix.component }}" "${{ matrix.target }}"

  # ── Stage 3: sanitizers and integration ───────────────────────────────────

  sanitizers:
    name: Sanitizers — ${{ matrix.component }}
    needs: unit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        component: [datapath, core, panel]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ASan and UBSan
        run: make -C "${{ matrix.component }}" san

  integration-scripts:
    name: Integration — installer, updater, firewall scripts
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq busybox
      # Every scripts/test-* runs. A hand-picked list drifts away from the
      # tree; discovery does not.
      - name: Run every scripts/test-*
        run: |
          set -euo pipefail
          shopt -s nullglob
          for t in scripts/test-*.sh;  do echo "== $t ==";  sh "$t";   done
          for t in scripts/test-*.cjs; do echo "== $t ==";  node "$t"; done

  integration-install:
    name: Integration — install, upgrade, uninstall (ARM64 container)
    needs: build
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Load netfilter modules on the host
        # A container cannot load kernel modules; the installer requires them.
        run: sudo modprobe -a nfnetlink_queue xt_NFQUEUE xt_connbytes xt_multiport xt_mark xt_connmark xt_conntrack xt_addrtype xt_comment ip6table_mangle
      - name: Lifecycle in a disposable container
        run: sh scripts/lab-install.sh

  integration-panel:
    name: Integration — panel in Chrome
    needs: [lint, warnings]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      D2K_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - uses: browser-actions/setup-chrome@39ce663831f86d2ea36cbda0a8143709cdfcc410 # v2.2.0
        id: chrome
        with:
          chrome-version: stable
      - name: Build the panel
        run: make -C panel d2kpanel
      - name: Rendering, controls and layout
        env:
          CHROME_BIN: ${{ steps.chrome.outputs.chrome-path }}
          D2K_CAPTURE_DIR: ${{ runner.temp }}/panel-browser
        run: |
          set -euo pipefail
          mkdir -p "$D2K_CAPTURE_DIR"
          node panel/test_browser.cjs 2>&1 | tee "$D2K_CAPTURE_DIR/browser.log"
      - name: Keep screenshots on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: panel-browser
          path: ${{ runner.temp }}/panel-browser
          retention-days: 7

  # ── Stage 4: the single required check ────────────────────────────────────

  ci-ok:
    name: CI passed
    # Branch protection requires THIS job only. Adding or renaming jobs above
    # then needs no change in repository settings.
    if: always()
    needs: [lint, warnings, build, unit, sanitizers, integration-scripts, integration-install, integration-panel]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # A skipped job counts as a failure: when build fails, the jobs that
      # need it are skipped, and the gate must not turn green on that.
      - name: Fail if any required job did not succeed
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
      - name: All required jobs succeeded
        run: echo "CI passed"
