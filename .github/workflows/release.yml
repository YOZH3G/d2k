name: D2K release
# Ручной выпуск с main: девять арок, проверки под QEMU, архивы для
# d2k-update.sh, latest.json с хешами и его подпись Ed25519. Роутеры берут
# releases/latest/download/latest.json, проверяют подпись закреплённым ключом
# и ставят архив своей арки его же установщиком.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: Что изменилось (покажется в панели)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: d2k-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: d2k-signing
    permissions:
      contents: write
    env:
      NOTES: ${{ inputs.notes }}
      PUBLIC_KEY_HEX: ${{ vars.D2K_SIGNING_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Компиляторы и QEMU
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq make python3 openssl qemu-user binutils file nodejs
          cd "$RUNNER_TEMP"
          curl --fail --proto '=https' --location --max-time 180 https://ziglang.org/download/0.16.0/zig-x86_64-linux-0.16.0.tar.xz -o zig16.tar.xz
          echo '70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00  zig16.tar.xz' | sha256sum -c -
          tar -xJf zig16.tar.xz
          curl --fail --proto '=https' --location --max-time 180 https://ziglang.org/download/0.14.1/zig-x86_64-linux-0.14.1.tar.xz -o zig14.tar.xz
          echo '24aeeec8af16c381934a6cd7d95c807a8cb2cf7df9fa40d359aa884195c4716c  zig14.tar.xz' | sha256sum -c -
          tar -xJf zig14.tar.xz
          echo "ZIG=$RUNNER_TEMP/zig-x86_64-linux-0.16.0/zig" >> "$GITHUB_ENV"
          echo "ZIG_MIPS64EL=$RUNNER_TEMP/zig-x86_64-linux-0.14.1/zig" >> "$GITHUB_ENV"
          sha=$(git rev-parse --short=7 HEAD)
          echo "RELEASE_ID=d2k-$(date -u +%Y%m%d-%H%M)-$sha" >> "$GITHUB_ENV"
          echo "VERSION=$(date -u +%d.%m.%Y) ($sha)" >> "$GITHUB_ENV"
      - name: Сборка девяти арок и проверки под QEMU
        run: |
          set -eu
          sh scripts/build-router.sh
          sh scripts/build-router-tests.sh
          sh scripts/check-router-builds.sh
      - name: Архивы, latest.json и подпись
        shell: bash
        env:
          PRIVATE_KEY: ${{ secrets.D2K_ED25519_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          sh scripts/package-release.sh builds "$out"
          key="$RUNNER_TEMP/signing.pem"
          trap 'rm -f "$key"' EXIT
          (umask 077; printf '%s\n' "$PRIVATE_KEY" > "$key")
          openssl pkeyutl -sign -inkey "$key" -rawin -in "$out/latest.json" -out "$out/latest.json.sig"
          # Проверка тем же открытым ключом, что закреплён в d2k-update.sh.
          pub=$(python3 -c 'import base64,os; print(base64.b64encode(bytes.fromhex("302a300506032b6570032100"+os.environ["PUBLIC_KEY_HEX"])).decode())')
          grep -qF "$pub" files/d2k-update.sh
          printf -- '-----BEGIN PUBLIC KEY-----\n%s\n-----END PUBLIC KEY-----\n' "$pub" > "$RUNNER_TEMP/public.pem"
          openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/public.pem" -rawin \
            -in "$out/latest.json" -sigfile "$out/latest.json.sig"
      - name: Публикация выпуска
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/release"
          gh release create "$RELEASE_ID" --target "$GITHUB_SHA" --latest \
            --title "D2K $VERSION" --notes "${NOTES:-Выпуск D2K $VERSION}" \
            "$out"/d2k-*.tar.gz "$out/latest.json" "$out/latest.json.sig"
