<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#eab71f">
<title>D2K — Слайдоскоп</title>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="stylesheet" href="/assets/panel.css">
<script src="/assets/panel.js" defer></script>
</head>
<body>
<div class="frame">
  <aside class="rail">
    <a class="brand" href="#overview" aria-label="D2K — на главную">
      <svg class="brand-mark" aria-hidden="true" width="58" height="36" viewBox="0 0 58 36"><path fill="currentColor" d="M0 32 19 4h10L10 32zm19 0L38 4h10L29 32z"/><path fill="#82948c" d="m38 32 19-28h1v15l-9 13z"/></svg>
      <span class="brand-name">D2K /<span>Слайдоскоп</span></span>
    </a>
    <nav class="nav" aria-label="Разделы панели">
      <a class="nav-link active" href="#searches"><span>Подборы</span></a>
      <a class="nav-link" href="#families"><span>Семейства</span></a>
      <a class="nav-link" href="#boxes"><span>Результаты</span></a>
      <a class="header-tool" href="#box-filter" aria-label="Поиск по результатам"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="m15 15 7 7"/></svg><span>Поиск</span></a>
      <a class="header-tool" href="#diagnostics" aria-label="Диагностика и настройки"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 3 1-2h4l1 2 3 2 3 1v4l-2 2 2 2v4l-3 1-3 2-1 2h-4l-1-2-3-2-3-1v-4l2-2-2-2V6l3-1z"/><circle cx="12" cy="12" r="3"/></svg></a>
    </nav>
    <div class="rail-bottom">
      <span class="rail-dot" aria-hidden="true"></span>
      <span><b id="rail-state">Подключаемся</b><small id="rail-updated">к локальному движку</small></span>
    </div>
  </aside>

  <div class="workspace">
    <header class="topbar">
      <span class="crumb">Keenetic <i>/</i> <b>Автоматический подбор обходов</b></span>
      <span class="live-indicator" id="live-indicator"><i></i><span>Получение данных</span></span>
    </header>
    <main id="app" class="content" aria-live="polite" aria-busy="true">
      <div class="loading"><span class="loader" aria-hidden="true"></span><p>Подключаюсь к D2K…</p></div>
    </main>
  </div>
</div>
</body>
</html>
